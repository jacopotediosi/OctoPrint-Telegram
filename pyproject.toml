[build-system]
requires = [
    "setuptools>=68",
]
build-backend = "setuptools.build_meta"

[project]
name = "OctoPrint-Telegram"
version = "1.12.1"
description = "Control your printer and receive notification messages via Telegram Messenger."
authors = [
    { name = "Jacopo Tediosi", email = "jacopotediosi@gmail.com" },
]
requires-python = ">=3.7,<4"
dependencies = [
    "pillow>=9.1",  # For Image.Transpose and Image.Resampling
    "psutil",
    "pylru>=1.1",  # For lrucache.get()
    "requests[socks]",
    "sarge>=0.1.5",  # For run(async_=...)
    "typing_extensions>=4.4",  # For typing_extensions.override
    "urllib3",
]
dynamic = [
    "license",
]

[project.entry-points."octoprint.plugin"]
telegram = "octoprint_telegram"

[project.urls]
Homepage = "https://github.com/jacopotediosi/OctoPrint-Telegram"

[project.optional-dependencies]
develop = [
    "go-task-bin",
]

[dependency-groups]
typechecking = [
    "OctoPrint==2.0.0rc5 ; python_version >= '3.9' and python_version < '3.15'",
]

[project.readme]
file = "README.md"
content-type = "markdown"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = [
    "octoprint_telegram",
    "octoprint_telegram.*",
]

[tool.ruff]
line-length = 120
fix = true

[tool.ruff.lint]
preview = true
explicit-preview-rules = true
extend-select = [
    "ALL",
    "D420", # incorrect-section-order (preview)
    "DOC102", # docstring-extraneous-parameter (preview)
    "DOC201", # docstring-missing-returns (preview)
    "DOC202", # docstring-extraneous-returns (preview)
    "DOC402", # docstring-missing-yields (preview)
    "DOC403", # docstring-extraneous-yields (preview)
    "DOC501", # docstring-missing-exception (preview)
]
ignore = [
    "BLE001", # blind-except
    "C901", # complex-structure
    "COM812", # missing-trailing-comma
    "CPY001", # missing-copyright-notice
    "D100", # undocumented-public-module
    "D101", # undocumented-public-class
    "D104", # undocumented-public-package
    "E501", # line-too-long
    "EM101", # raw-string-in-exception
    "EM102", # f-string-in-exception
    "ERA001", # commented-out-code
    "FBT001", # boolean-type-hint-positional-argument
    "FBT002", # boolean-default-value-positional-argument
    "FBT003", # boolean-positional-value-in-call
    "FIX002", # line-contains-todo
    "N801", # invalid-class-name
    "N802", # invalid-function-name
    "N803", # invalid-argument-name
    "N806", # non-lowercase-variable-in-function
    "PERF203", # try-except-in-loop
    "PERF401", # manual-list-comprehension
    "PGH003", # blanket-type-ignore
    "PLR0911", # too-many-return-statements
    "PLR0912", # too-many-branches
    "PLR0913", # too-many-arguments
    "PLR0915", # too-many-statements
    "PLR0917", # too-many-positional-arguments
    "PLR1714", # repeated-equality-comparison
    "PLR2004", # magic-value-comparison
    "PLR5501", # collapsible-else-if
    "S110", # try-except-pass
    "SIM105", # suppressible-exception
    "SIM108", # if-else-block-instead-of-if-exp
    "TD002", # missing-todo-author
    "TD003", # missing-todo-link
    "TID252", # relative-imports
    "TRY002", # raise-vanilla-class
    "TRY003", # raise-vanilla-args
    "TRY400", # error-instead-of-exception
]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true

[tool.ruff.lint.per-file-ignores]
"dev_utils/**" = [
    "INP001", # implicit-namespace-package
    "T201", # print
]
"octoprint_telegram/emoji/unicode_emoji_dict.py" = [
    "RUF001", # ambiguous-unicode-character-string
]

[tool.ruff.lint.pydoclint]
ignore-one-line-docstrings = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ty.environment]
python-version = "3.7"

[tool.djlint]
no_set_formatting=true
ignore = [
    "H021", # Inline styles should be avoided.
]

[tool.codespell]
skip = "octoprint_telegram/emoji/unicode_emoji_dict.py"
